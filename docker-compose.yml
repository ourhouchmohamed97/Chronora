services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chronora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  nextjs:
    build: .
    env_file:
      - .env
    environment:
      NEXTAUTH_URL: https://localhost
      NEXT_PUBLIC_APP_URL: https://localhost
    depends_on:
      - postgres
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - nextjs
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge